<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="tokens.css" />
  <style>
    body {
      width: 340px;
      margin: 0;
      padding: 22px;
      background: var(--bg);
      color: var(--fg);
      font-family: var(--font-sans);

  <div class="card"><div id="app"></div></div>
  <div id="footer-slot"></div>
  <script type="module" src="popup.js"></script>

</html>
