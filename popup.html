<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="tokens.css" />
  <style>
    body {
      width: 300px;
      margin: 0;
      padding: 22px;
      background: var(--bg);
      color: var(--fg);
      font-family: var(--font-sans);
    }
    .brand { display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 700; }
    .tag { color: var(--muted-fg); font-size: 13px; margin: 8px 0 18px; line-height: 1.5; }
    #stream {
      width: 100%;
      padding: 12px 16px;
      border: none;
      border-radius: var(--radius);
      background: var(--primary);
      color: var(--primary-fg);
      font-size: 14px;
      font-weight: 600;
      font-family: var(--font-sans);
      cursor: pointer;
      transition: filter .15s ease;
    }
    #stream:hover { filter: brightness(1.08); }
  </style>
</head>
<body>
  <div class="brand" id="brand"></div>
  <p class="tag" id="tag"></p>
  <button id="stream"></button>
  <script type="module" src="popup.js"></script>
</body>
</html>
