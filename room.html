<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Stream for All</title>
  <link rel="stylesheet" href="tokens.css" />
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--fg);
      font-family: var(--font-sans);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #onboard-wrap, #room-panel { width: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; }
    #room-panel:has(.zoom-mode) { padding: 0; }
    .card {
      width: 100%;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 26px;
      max-height: 92vh;
      overflow: auto;
    }
    #onboard { max-width: 340px; padding: 28px 26px; }
    #room-card { max-width: 400px; transition: max-width .4s cubic-bezier(.4, 0, .2, 1); }
    #room-card.zoom-mode {
      max-width: 100vw;
      background: #000;
      height: 100vh;
      max-height: 100vh;
      padding: 16px;
      border: none;
      border-radius: 0;
      display: flex; flex-direction: column;
      overflow: hidden;
      box-sizing: border-box;
    }
    #member-sidebar { display: none; }
    #room-card.zoom-mode #stage { flex: 1; min-height: 0; display: flex; flex-direction: row; gap: 16px; margin-top: 14px; position: relative; }
    #room-card.zoom-mode #member-sidebar {
      display: flex; flex-direction: column; width: 280px; flex: 0 0 auto;
      background: var(--secondary); border-radius: var(--radius);
      padding: 12px;
    }
    #room-card.zoom-mode #sidebar-controls {
      display: flex; flex-direction: column; gap: 8px;
      padding: 12px 0 16px; margin-top: 10px; border-top: 1px solid var(--border);
    }
    #room-card.zoom-mode #member-list { flex: 1; min-height: 0; overflow-y: auto; }
    #room-card.zoom-mode #sidebar-footer { flex: 0 0 auto; padding-top: 12px; border-top: 1px solid var(--border); }
    #room-card.zoom-mode #sidebar-footer #room-footer { margin-top: 0; padding: 0; }
    #room-card.zoom-mode #zoom-stage {
      flex: 1; min-height: 0; margin: 0;
      position: relative; display: block;
    }
    #room-card.zoom-mode #zoom-stage > * {
      transition: left .3s ease, top .3s ease, width .3s ease, height .3s ease;
    }
    @keyframes sfa-fade-up {
      from { opacity: 0; transform: translateY(18px); }
      to { opacity: 1; transform: translateY(0); }
    }
    #zoom-stage > .stage-enter {
      transition: none !important;
      animation: sfa-fade-up .38s cubic-bezier(.22, .7, .3, 1) .12s backwards;
    }
    #room-card.zoom-mode #zoom-stage video { width: 100%; height: 100%; object-fit: cover; aspect-ratio: auto; transition: filter .15s ease; }
    #room-card.zoom-mode #zoom-stage > [data-zoomable]:hover video { filter: brightness(.75); }

    #room-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
    #header-actions { display: flex; align-items: center; gap: 6px; flex: 0 0 auto; }
    #room-title { font-size: 20px; font-weight: 700; letter-spacing: -.01em; color: var(--fg); }
    #status { color: var(--muted-fg); font-size: 13px; margin-top: 3px; }
    #waiting {
      text-align: center; color: var(--muted-fg); font-size: 13px; font-weight: 600; margin-top: 20px;
      padding: 13px; border: 1px solid var(--border); border-radius: var(--radius);
      background: linear-gradient(100deg, var(--secondary) 15%, rgba(255, 255, 255, .1) 50%, var(--secondary) 85%);
      background-size: 200% 100%;
      animation: sfa-shimmer 3.5s linear infinite;
    }
    @keyframes sfa-shimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }
    .section-label {
      font-size: 11px; text-transform: uppercase; letter-spacing: .05em;
      color: var(--muted-fg); font-weight: 600; margin: 18px 0 6px;
    }
    #grid { display: flex; flex-direction: column; gap: 10px; }
    #grid:not(:empty) { margin: 16px 0; }
    #zoom-stage {
      display: grid; gap: 12px; margin: 16px 0;
      grid-template-columns: repeat(auto-fit, minmax(min(480px, 100%), 1fr));
    }
    #room-card.zoom-mode #grid { display: none; }
    #room-card.zoom-mode #empty-hint:not([hidden]) {
      flex: 1; align-self: stretch;
      display: flex; align-items: center; justify-content: center;
      padding: 0;
    }
    #room-card.zoom-mode #thumbs-wrap { display: none !important; }
    #room-card.zoom-mode #room-actions { margin-top: 0; flex: 0 0 auto; }
    #room-card.zoom-mode #sidebar-controls #header-actions {
      width: 100%; gap: 0;
      border: 1px solid var(--border); border-radius: var(--radius);
      background: var(--card);
    }
    #room-card.zoom-mode #sidebar-controls #header-actions button {
      flex: 1 1 0 !important; width: auto !important; height: 38px !important;
      border: none !important; border-radius: 0 !important;
      border-left: 1px solid var(--border) !important;
      background: transparent !important;
    }
    #room-card.zoom-mode #sidebar-controls #header-actions button:hover {
      background: var(--muted) !important;
    }
    #room-card.zoom-mode #sidebar-controls #header-actions button:first-child {
      border-left: none !important;
      border-radius: var(--radius) 0 0 var(--radius) !important;
    }
    #room-card.zoom-mode #sidebar-controls #header-actions button:last-child {
      border-radius: 0 var(--radius) var(--radius) 0 !important;
    }
    #room-card.zoom-mode #sidebar-controls #header-actions button > span { z-index: 1; }
    #room-card.zoom-mode #sidebar-controls #stream-settings-slot button {
      width: 40px !important; height: 40px !important;
      box-sizing: border-box; border-radius: var(--radius);
    }
    #room-card.zoom-mode #share {
      flex: 1; height: 40px; padding: 0 12px; font-size: 13px; font-weight: 600;
      box-sizing: border-box; border-radius: var(--radius);
    }
    #thumbs.blocks { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    #empty-hint { color: var(--muted-fg); font-size: 13px; text-align: center; padding: 24px 0; }

    #room-actions { display: flex; align-items: center; gap: 8px; margin-top: 20px; }
    #share {
      flex: 1; padding: 11px 16px; border-radius: var(--radius); font-size: 14px; font-weight: 600;
      cursor: pointer; font-family: var(--font-sans); border: 1px solid transparent;
      transition: filter .15s ease; background: var(--primary); color: var(--primary-fg);
    }
    #share:hover { filter: brightness(1.08); }
    #share.danger { background: var(--destructive); color: #fff; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <div id="onboard-wrap">
    <div id="onboard" class="card"></div>
  </div>

  <div id="room-panel" hidden>
    <div id="room-card" class="card">
      <div id="room-header">
        <div>
          <div id="room-title"></div>
          <div id="status"></div>
        </div>
        <div id="header-actions"></div>
      </div>
      <div id="stage">
        <div id="member-sidebar">
          <div id="member-list"></div>
          <div id="sidebar-controls"></div>
          <div id="sidebar-footer"></div>
        </div>
        <div id="zoom-stage" hidden></div>
        <div id="grid"></div>
        <div id="thumbs-wrap" hidden>
          <div class="section-label"></div>
          <div id="thumbs" class="blocks"></div>
        </div>
        <div id="empty-hint" hidden></div>
      </div>
      <div id="room-actions">
        <button id="share"></button>
        <div id="stream-settings-slot"></div>
      </div>
      <div id="waiting" hidden></div>
    </div>
  </div>

  <script type="module" src="room.js"></script>
</body>
</html>
